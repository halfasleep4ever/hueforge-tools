<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Palette Match · HueForge Tools</title><link rel="stylesheet" href="../assets/common.css">
<style>.pair{display:grid;gap:12px;grid-template-columns:1fr 1fr}@media(max-width:600px){.pair{grid-template-columns:1fr}}.pair canvas{width:100%}</style></head>
<body><div class="wrap"><h1>Palette Match</h1><p class="muted">Recolour the picture with only the filaments you pick. Each pixel gets the nearest filament colour (Lab, deltaE).</p>
<div class="cols"><div>
<div class="drop" id="drop">Drop a picture here, or tap to choose</div>
<div class="card" style="margin-top:12px"><h2 style="margin-top:0">Filaments</h2>
<div class="row"><label style="margin:0">Suggest best</label><input type="number" id="n" min="1" max="12" value="4" style="width:64px"><button class="ghost" id="sug">Suggest filaments</button></div>
<div id="list"></div>
<label><input type="checkbox" id="dith"> Dithering (mix dots for in-between tones)</label>
<div class="row" style="margin-top:12px"><button id="exp">Export PNG</button><button class="ghost" id="save">Save project</button></div>
<p class="small muted" id="msg"></p></div></div>
<div><div class="pair"><div><b class="small">Original</b><canvas id="a"></canvas></div><div><b class="small">Recoloured</b><canvas id="b"></canvas></div></div>
<h2>Palette</h2><table id="tbl"><thead><tr><th></th><th>Filament</th><th>TD</th><th>Coverage</th></tr></thead><tbody></tbody></table>
<p class="small muted" id="fit"></p></div></div></div>
<script type="module" src="match.js"></script></body></html>
