<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Text Studio</title><link rel="stylesheet" href="../assets/common.css">
<style>@font-face{font-family:"Lilita One";src:url(../assets/fonts/LilitaOne-Regular.ttf)}@font-face{font-family:"Bebas Neue";src:url(../assets/fonts/BebasNeue-Regular.ttf)}@font-face{font-family:"Pacifico";src:url(../assets/fonts/Pacifico-Regular.ttf)}
#cv{width:100%;height:auto;display:block;cursor:grab;touch-action:none}#cv.drag{cursor:grabbing}textarea{width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.two input,.two select{width:100%}output{font-family:var(--mono);font-size:13px;color:var(--text)}#checks .note{margin:6px 0}</style></head>
<body><div class="wrap">
<h1>Text Studio</h1><p class="muted">Put a name, price or title on a picture for HueForge, and check it stays readable at print size.</p>
<div class="cols">
<div class="card">
  <div class="drop" id="drop">Drop a picture (optional), or click</div>
  <div class="two"><div><label>Print width (mm)</label><input type="number" id="pw" value="150" min="20" max="600"></div><div><label>Height (mm)</label><input type="number" id="ph" value="100" min="20" max="600" title="Set by the picture when you add one"></div></div>
  <label>Text</label><div class="row"><select id="item" style="flex:1"></select><button class="ghost" id="add">Add</button><button class="ghost" id="del">Remove</button></div>
  <textarea id="txt" rows="2">Daniel</textarea>
  <div class="two"><div><label>Font</label><select id="font"><option>Lilita One</option><option>Bebas Neue</option><option>Pacifico</option><option value="system-ui">Plain (bold)</option></select></div>
  <div><label>Letter height (mm)</label><input type="number" id="size" value="18" min="2" step="0.5"></div>
  <div><label>Text colour</label><input type="color" id="col" value="#ffffff"></div><div><label>Shadow</label><select id="shadow"><option value="0">None</option><option value="1">Solid shadow</option></select></div>
  <div><label>Outline (mm)</label><input type="number" id="ow" value="0" min="0" step="0.2"></div><div><label>Outline colour</label><input type="color" id="oc" value="#111111"></div></div>
  <p class="small muted">Drag the text on the picture to move it.</p>
  <label>Raised part height (mm)</label><input type="number" id="rh" value="0.8" min="0.2" step="0.2">
</div>
<div>
  <div class="card"><canvas id="cv"></canvas><div id="checks"></div>
  <div class="row" style="margin-top:8px"><button id="png">Download PNG for HueForge</button><button class="ghost" id="svg">Text as SVG</button><button class="ghost" id="stl">Text as STL</button><button class="ghost" id="save">Save to Projects</button></div>
  <p class="small muted" id="status"></p></div>
</div></div></div>
<script type="module" src="app.js"></script></body></html>
