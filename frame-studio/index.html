<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frame Studio</title><link rel="stylesheet" href="../assets/common.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>.view{height:min(70vh,560px);min-height:300px;padding:0;overflow:hidden}.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.f2 input,.f2 select{width:100%}
.chk{display:flex;gap:8px;align-items:center;color:var(--text);font-size:14px}.stat b{font-family:var(--mono)}</style></head>
<body><div class="wrap">
<h1>Frame Studio</h1><p class="muted">Type the size of your print. Get a frame STL it slides into.</p>
<div class="cols">
 <div class="card">
  <h2>Your print</h2>
  <div class="f2">
   <div><label for="w">Width (mm)</label><input id="w" type="number" step="0.1" min="20"></div>
   <div><label for="h">Height (mm)</label><input id="h" type="number" step="0.1" min="20"></div>
   <div><label for="t">Thickness (mm)</label><input id="t" type="number" step="0.1" min="0.4"></div>
   <div><label for="tol">Tolerance (mm)</label><input id="tol" type="number" step="0.05" min="0"></div>
  </div>
  <h2>Frame</h2>
  <div class="f2">
   <div><label for="border">Border width</label><input id="border" type="number" step="0.5" min="4"></div>
   <div><label for="lip">Lip over print</label><input id="lip" type="number" step="0.5" min="1"></div>
   <div><label for="front">Front thickness</label><input id="front" type="number" step="0.2" min="0.8"></div>
   <div><label for="radius">Corner radius</label><input id="radius" type="number" step="0.5" min="0"></div>
  </div>
  <label for="mode">How the print goes in</label>
  <select id="mode" style="width:100%"><option value="slide">Slides in from the top (back lip holds it)</option><option value="drop">Drops in from the back (open back)</option></select>
  <div style="margin-top:10px">
   <label class="chk"><input type="checkbox" id="stand"> Stand foot on the back</label>
   <label class="chk"><input type="checkbox" id="hanger"> Keyhole hanger on the back</label>
   <label class="chk"><input type="checkbox" id="tabs"> Joining tabs on the sides</label>
  </div>
  <div id="stats" class="stat small" style="margin-top:12px"></div>
  <div id="warn"></div>
  <div class="row" style="margin-top:12px"><button id="dl">Download STL</button><button id="save" class="ghost">Save</button></div>
  <p class="muted small">Print face down, no supports. Tabs: the right tab slides into the next frame's left socket.</p>
 </div>
 <div class="card view" id="view"></div>
</div></div>
<script type="module">
import { header, download } from "../assets/ui.js";
import { saveProject, getProject, projectIdFromUrl } from "../assets/projects.js";
import { loadDeps, writeSTL, createViewer, edgeCheck } from "../assets/mesh3d.js";
import { DEFAULTS, buildFrame, frameInfo } from "./frame.js";
import * as THREE from "three"; import { OrbitControls } from "three/addons/controls/OrbitControls.js";
header("Frame Studio");
const $ = id => document.getElementById(id), num = ["w", "h", "t", "tol", "border", "lip", "front", "radius"], chk = ["stand", "hanger", "tabs"];
let P = { ...DEFAULTS }, last = null, projId = projectIdFromUrl();
if (projId) { const p = await getProject(projId); if (p && p.data) P = { ...P, ...p.data }; }
const fill = () => { num.forEach(k => $(k).value = P[k]); chk.forEach(k => $(k).checked = !!P[k]); $("mode").value = P.mode; };
const read = () => { num.forEach(k => { const v = parseFloat($(k).value); if (isFinite(v)) P[k] = v; }); chk.forEach(k => P[k] = $(k).checked); P.mode = $("mode").value; };
fill();
$("stats").textContent = "Loading the geometry engine…";
await loadDeps();
const viewer = createViewer(THREE, OrbitControls, $("view"));
let first = true, timer;
function run() {
  read(); const I = frameInfo(P);
  $("warn").innerHTML = I.warn.map(w => `<p class="note small">${w}</p>`).join("");
  try { last = buildFrame(P); } catch (e) { $("warn").innerHTML += `<p class="note bad small">${e.message}</p>`; return; }
  const f = v => v.toFixed(1);
  $("stats").innerHTML = `Opening you see: <b>${f(I.win[0])} × ${f(I.win[1])} mm</b><br>Pocket for the print: <b>${f(I.pocket[0])} × ${f(I.pocket[1])} × ${f(P.t + P.tol)} mm</b><br>Outside size: <b>${f(I.outer[0])} × ${f(I.outer[1])} × ${f(I.depth)} mm</b><br>Side wall: <b>${f(I.wall)} mm</b> · Plastic: <b>${(last.volume / 1000).toFixed(1)} cm³</b>`;
  viewer.show([{ mesh: last.mesh, color: "#d9a066" }], { keepView: !first }); first = false;
}
document.querySelectorAll("input,select").forEach(e => e.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(run, 150); }));
$("dl").onclick = () => { if (!last) return; const ec = edgeCheck(last.mesh); if (!ec.watertight) alert("Warning: mesh is not watertight."); download(`frame_${P.w}x${P.h}.stl`, writeSTL(last.mesh), "model/stl"); };
$("save").onclick = async () => { read(); const p = await saveProject({ id: projId || undefined, tool: "frame-studio", name: `Frame ${P.w} × ${P.h}`, data: { ...P } }); projId = p.id; $("save").textContent = "Saved"; setTimeout(() => $("save").textContent = "Save", 1200); };
run();
</script></body></html>
